[project]
name = "helper"
version = "0.1.0"
description = "本地桌面 AI 助手（本机检索 + 云端大模型回答）"
requires-python = ">=3.12"
# 运行时依赖统一在装环境时写进 requirements.txt（安装成功后 pip freeze 出 lock 文件），
# 此处不重复声明，避免两处清单漂移。
dependencies = []

[project.scripts]
# 以包方式启动：python -m app
# （app/__main__.py 在 P0 落地，见 docs/技术方案.md §13）
helper = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".tmp", "models", "data", "logs", "nicegui-test-storage*", ".ruff_cache"]

[tool.ruff.lint]
# 只开"真问题"这一类：先别引入重构类规则（N/PLR/PLW 会吵得没法看）
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "ARG", "PTH", "RUF"]
ignore = [
    "E501",    # 行长由 line-length 管，注释里的中文表格不重排
    "RUF001",  # 中文标点的"歧义字符"提示对中文注释没意义
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# ARG 只对 app/ 有意义：tests/ 里 139 处"未使用参数"全是替身/夹具要签名一致，属噪音
"tests/**" = ["ARG001", "ARG002", "ARG005"]
"app/__main__.py" = ["E402", "I001"]  # 入口**故意**把 os.environ 设置放在 import 之前：
                                        # 重排 import 会让 QTWEBENGINE_* 晚于 Qt 加载 → 窗口白板
