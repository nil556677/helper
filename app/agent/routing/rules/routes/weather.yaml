id: weather
label: 查天气
description: "查询城市当前或未来天气、气温、下雨、冷暖"
examples:
  - "北京天气怎么样"
  - "明天气温多少"
  - "会下雨吗"
  - "最近天气如何"
  - "外面气温如何"
  - "明天冷不冷"
  - "出门要带伞吗"
  - "今天最高温度多少"
tools: [query_weather]
node: dispatch_fixed
required_params:
  - name: city
    extract_regex: "(?:在|查|看看)?([\\u4e00-\\u9fa5]{2,6}?)(?:的)?(?:天气|气温|温度|下不下雨|下雨)"
    question: "请问想查哪个城市的天气？"
    options: ["北京", "上海", "广州", "深圳"]