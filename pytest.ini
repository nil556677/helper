[pytest]
# 所有命令都在仓库根执行：app/ 需要仓库根在 sys.path 里（app 内部再分 ui/services/core）
pythonpath = .
testpaths = tests
# `-p nicegui.testing.user_plugin` 提供界面测试的 user 装置（进程内模拟用户，不需要浏览器）；
# `-p no:cacheprovider` 关掉 pytest 缓存——它用 ``tempfile.mkdtemp`` 建 0o700 目录，
# 而受限令牌下列不出也写不进那种目录（技术方案 §11 第 7 条记的环境事实），只会刷警告。
addopts = -q --strict-markers -p nicegui.testing.user_plugin -p no:cacheprovider
# 界面测试是 async 的（NiceGUI 的装置就是 async fixture）
asyncio_mode = auto
# 该装置用 runpy 执行这个"主文件"来注册页面；见 tests/ui/nicegui_main.py 的说明
main_file = tests/ui/nicegui_main.py
markers =
    slow: 需要本地模型或网络的慢用例（P2 起用）
    eval: 检索质量评测（黄金集，P2 起用）
